[package]
name = "scan-rust"
version = "0.2.2"
edition = "2021"

[lib]
name = "_scan_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
scan-core = { git = "https://github.com/Prabashoka/scan-core.git", tag = "v0.2.1" }

[profile.release]
opt-level = 3
lto = "fat"                   # cross-crate inlining across pyo3 + rayon boundary
codegen-units = 1             # single CGU enables full whole-program optimisation
panic = "abort"               # removes unwinding tables; smaller binary, faster runtime
